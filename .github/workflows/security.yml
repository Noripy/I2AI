name: Security

# 検知 → 自動修正 → 報告 までを人手なしで回す。
#   PR / push : 入ってくる変更を検査（脆弱な依存・危険なコード・防御の退行を止める）
#   毎日      : 昨日まで安全だった依存に新しい脆弱性が出ていないかを検査し、出ていれば修正 PR を自動で作る
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 依存パッケージの脆弱性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  smoke:
    name: 防御のスモークテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: アプリを起動して攻撃パターンを投げる
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          node scripts/security-smoke.mjs http://localhost:3000 || { cat server.log; exit 1; }

  codeql:
    name: コードの静的解析
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-review:
    name: PR で増える依存の検査
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  autofix:
    name: 脆弱性の自動修正 PR
    needs: audit
    if: always() && needs.audit.result == 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: security/audit-fix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 互換性を壊さない範囲で修正する
        run: npm audit fix --ignore-scripts || true
      - name: 修正後に壊れていないことを確かめる
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: 修正 PR を作る
        run: |
          if git diff --quiet; then echo "差分なし（自動では直せない）"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "依存パッケージの脆弱性を自動修正 (npm audit fix)"
          git push --force origin "$BRANCH"
          gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN || gh pr create \
            --base main --head "$BRANCH" \
            --title "依存パッケージの脆弱性を自動修正" \
            --body "毎日のセキュリティ検査で high 以上の脆弱性が見つかったため、\`npm audit fix\` で修正しました。この PR を作る前に、型チェック・テスト・ビルド・再監査がすべて通ることを確認済みです。変更は package-lock.json（と必要なら package.json）だけです。"

  report:
    name: 失敗を Issue で知らせる
    needs: [audit, smoke, codeql, autofix]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.smoke.result == 'failure' || needs.codeql.result == 'failure' || (needs.audit.result == 'failure' && needs.autofix.result != 'success'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUMMARY: "依存の脆弱性: ${{ needs.audit.result }} / 自動修正: ${{ needs.autofix.result }} / スモークテスト: ${{ needs.smoke.result }} / 静的解析: ${{ needs.codeql.result }}"
    steps:
      - name: 開いている Issue があれば追記、無ければ作る
        run: |
          gh label create security-auto --color B60205 --description "セキュリティ検査の自動通知" 2>/dev/null || true
          body="セキュリティ検査で、自動では直せない問題が見つかりました。

          $SUMMARY

          実行ログ: $RUN_URL
          対応手順: docs/security.md の「Issue が来たら」"
          n=$(gh issue list --label security-auto --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "セキュリティ検査が失敗しました" --label security-auto --body "$body"; fi
