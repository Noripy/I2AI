name: Dependabot auto-merge

# Dependabot の PR のうち、パッチ / マイナー更新だけを「CI が通ったら自動マージ」にする。
# メジャー更新は壊れる可能性があるので人が見る。
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Noripy/I2AI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: パッチ / マイナー更新なら自動マージを予約
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          # 必須チェックが無いと「CI を待たずにマージ」になってしまうので、その場合は何もしない。
          # Rulesets（新方式）と classic のブランチ保護（旧方式）のどちらで設定されていてもよい
          ruleset=$(gh api "repos/$GH_REPO/rules/branches/$BASE" --jq '[.[] | select(.type == "required_status_checks")] | length' 2>/dev/null || echo 0)
          classic=$(gh api "repos/$GH_REPO/branches/$BASE" --jq .protected 2>/dev/null || echo false)
          if [ "$ruleset" = "0" ] && [ "$classic" != "true" ]; then
            echo "::warning::$BASE に必須チェックが設定されていないため自動マージしません（docs/security.md の初期設定を参照）"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
